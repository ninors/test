<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A32NX Remote Pushback Controller</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(18, 26, 44, 0.7);
            --border-color: rgba(43, 62, 98, 0.4);
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --active-bg: rgba(59, 130, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        main {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .status-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 5px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger);
            box-shadow: 0 0 8px var(--danger);
            transition: all 0.3s ease;
        }

        .dot.connected {
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .conn-setup {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-success {
            background: var(--accent);
        }

        .btn-success:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .control-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
        }

        .control-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Slider Styles */
        .slider-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .slider-vertical {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        input[type="range"].vertical {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 16px;
            height: 180px;
            background: rgba(0, 0, 0, 0.3);
            outline: none;
            border-radius: 8px;
        }

        input[type="range"].horizontal {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            outline: none;
            border-radius: 4px;
            -webkit-appearance: none;
        }

        input[type="range"].horizontal::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: background 0.1s;
        }

        input[type="range"].horizontal::-webkit-slider-thumb:active {
            background: #60a5fa;
        }

        input[type="range"].vertical::-webkit-slider-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .value-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .action-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-row .btn {
            flex: 1;
            padding: 12px;
        }

        /* Airbus Dashboard Button Styles */
        .glass-btn {
            background: rgba(18, 26, 44, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .glass-btn:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .glass-btn.active {
            background: var(--active-bg);
            border-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .glass-btn .icon {
            font-size: 1.5rem;
        }

        .glass-btn .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .glass-btn.active .label {
            color: var(--primary);
        }

        .info-panel {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 5px;
        }

        .info-value {
            color: white;
            font-weight: 500;
        }

        /* Joystick Visualiser */
        .joystick-base {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--border-color);
            position: relative;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joystick-handle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
            position: absolute;
            cursor: pointer;
            transition: transform 0.05s ease-out;
        }

        .crosshair-h {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.1);
            position: absolute;
        }

        .crosshair-v {
            width: 1px;
            height: 100%;
            background: rgba(255,255,255,0.1);
            position: absolute;
        }
    </style>
</head>
<body>

    <header>
        <h1>A32NX Pushback Remote</h1>
        <div class="subtitle">Contrôle à distance du pushback FlyByWire A320</div>
    </header>

    <main>
        <!-- STATUS CARD -->
        <div class="card">
            <div class="status-container">
                <div class="status-indicator">
                    <span id="bridge-dot" class="dot"></span>
                    <span>Pont WebSocket</span>
                </div>
                <div class="status-indicator">
                    <span id="sim-dot" class="dot"></span>
                    <span>FSUIPC / Simu</span>
                </div>
            </div>

            <div class="conn-setup">
                <input type="text" id="server-ip" placeholder="Adresse IP du PC Simu (ex: 192.168.1.50)">
                <button id="btn-connect" class="btn">Connexion</button>
            </div>
        </div>

        <!-- CONTROLS CARD -->
        <div class="card">
            <!-- Systems Buttons (Airbus Style) -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <button id="btn-pb-system" class="glass-btn">
                    <span class="icon">⚙️</span>
                    <span style="font-size: 0.95rem;">Système Pushback</span>
                    <span id="lbl-pb-system" class="label">Désactivé</span>
                </button>

                <button id="btn-pb-tug" class="glass-btn">
                    <span class="icon">🚜</span>
                    <span style="font-size: 0.95rem;">Remorqueur (Tug)</span>
                    <span id="lbl-pb-tug" class="label">Déconnecté</span>
                </button>
            </div>

            <div class="control-grid">
                <!-- SPEED THROTTLE -->
                <div class="control-block">
                    <span class="control-title">Vitesse (Throttle)</span>
                    <div class="slider-vertical">
                        <input type="range" id="pb-speed" class="vertical" min="-100" max="100" value="0">
                    </div>
                    <span id="pb-speed-val" class="value-display">0%</span>
                    <button id="btn-stop" class="btn btn-danger" style="width: 100%;">STOP (0)</button>
                </div>

                <!-- STEERING -->
                <div class="control-block">
                    <span class="control-title">Direction (Steering)</span>
                    <div class="joystick-base" id="joy-base">
                        <div class="crosshair-h"></div>
                        <div class="crosshair-v"></div>
                        <div class="joystick-handle" id="joy-handle" style="left: 50px; top: 50px;"></div>
                    </div>
                    <div class="slider-container" style="margin-top: 10px;">
                        <input type="range" id="pb-steer" class="horizontal" min="-100" max="100" value="0">
                    </div>
                    <span id="pb-steer-val" class="value-display">CENTRE</span>
                    <button id="btn-center" class="btn btn-secondary" style="width: 100%;">CENTRE (0)</button>
                </div>
            </div>
        </div>

        <!-- QUICK CONFIG & AIRFRAME INFO -->
        <div class="card info-panel">
            <h3 style="color: white; margin-bottom: 10px; font-size: 1rem;">Informations Simulateur</h3>
            <div class="info-row">
                <span>Appareil détecté:</span>
                <span id="sim-aircraft" class="info-value">Inconnu</span>
            </div>
            <div class="info-row">
                <span>Vitesse Sol (GS):</span>
                <span id="sim-gs" class="info-value">0 kts</span>
            </div>
            <div class="info-row">
                <span>Frein de Parc (Parking Brake):</span>
                <span id="sim-park-brake" class="info-value">-</span>
            </div>
        </div>
    </main>

    <script>
        let ws = null;
        let heartBeatInterval = null;

        // UI Elements
        const serverIpInput = document.getElementById('server-ip');
        const btnConnect = document.getElementById('btn-connect');
        const bridgeDot = document.getElementById('bridge-dot');
        const simDot = document.getElementById('sim-dot');
        
        const btnPbSystem = document.getElementById('btn-pb-system');
        const lblPbSystem = document.getElementById('lbl-pb-system');
        const btnPbTug = document.getElementById('btn-pb-tug');
        const lblPbTug = document.getElementById('lbl-pb-tug');
        
        const speedSlider = document.getElementById('pb-speed');
        const speedVal = document.getElementById('pb-speed-val');
        const btnStop = document.getElementById('btn-stop');
        
        const steerSlider = document.getElementById('pb-steer');
        const steerVal = document.getElementById('pb-steer-val');
        const btnCenter = document.getElementById('btn-center');
        
        const joyBase = document.getElementById('joy-base');
        const joyHandle = document.getElementById('joy-handle');

        const simAircraft = document.getElementById('sim-aircraft');
        const simGs = document.getElementById('sim-gs');
        const simParkBrake = document.getElementById('sim-park-brake');

        // State variables
        let pbSystemEnabled = false;
        let tugConnected = false;

        // Load saved IP
        const savedIp = localStorage.getItem('pushback_bridge_ip');
        if (savedIp) {
            serverIpInput.value = savedIp;
        } else {
            // Auto detect if page is loaded from our server
            const hostname = window.location.hostname;
            if (hostname && hostname !== 'localhost' && hostname !== '127.0.0.1') {
                serverIpInput.value = hostname;
            } else {
                serverIpInput.value = '127.0.0.1';
            }
        }

        // Connection logic
        function connect() {
            const ip = serverIpInput.value.trim() || 'localhost';
            localStorage.setItem('pushback_bridge_ip', ip);
            
            btnConnect.textContent = 'Connexion...';
            btnConnect.disabled = true;

            if (ws) {
                ws.close();
            }

            // Connect to our C# Bridge WS
            ws = new WebSocket(`ws://${ip}:8001/ws`);

            ws.onopen = () => {
                bridgeDot.classList.add('connected');
                btnConnect.textContent = 'Déconnecter';
                btnConnect.disabled = false;
                btnConnect.classList.add('btn-danger');
                console.log('Connecté au pont PushbackBridge');
                
                // Initialize request
                sendMessage({ command: "init" });
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleIncomingMessage(data);
                } catch (e) {
                    console.error("Erreur parsing message:", e);
                }
            };

            ws.onclose = () => {
                bridgeDot.classList.remove('connected');
                simDot.classList.remove('connected');
                btnConnect.textContent = 'Connexion';
                btnConnect.disabled = false;
                btnConnect.classList.remove('btn-danger');
                resetUIState();
                console.log('Pont déconnecté');
            };

            ws.onerror = (err) => {
                console.error("Erreur WebSocket:", err);
            };
        }

        function sendMessage(obj) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(obj));
            }
        }

        // Handle buttons
        btnConnect.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            } else {
                connect();
            }
        });

        // Toggle FlyByWire Pushback system
        btnPbSystem.addEventListener('click', () => {
            const targetState = !pbSystemEnabled;
            sendMessage({
                command: "vars.calc",
                name: "set_pb_sys",
                code: `${targetState ? 1 : 0} (>L:A32NX_PUSHBACK_SYSTEM_ENABLED, Number)`
            });
            // Anticipate state change to make it feel responsive
            setPbSystemState(targetState);
        });

        // Toggle Tug connection (SimConnect Event)
        btnPbTug.addEventListener('click', () => {
            sendMessage({
                command: "vars.calc",
                name: "toggle_tug",
                code: "(>K:TOGGLE_PUSHBACK)"
            });
        });

        // Set speed throttle
        function sendSpeed(val) {
            // Speed factor is between -1.0 and 1.0
            const factor = (val / 100).toFixed(2);
            sendMessage({
                command: "vars.calc",
                name: "set_speed",
                code: `${factor} (>L:A32NX_PUSHBACK_SPD_FACTOR, Number)`
            });
            
            // UI text update
            if (val > 0) {
                speedVal.textContent = `AVANT ${val}%`;
                speedVal.style.color = '#3b82f6';
            } else if (val < 0) {
                speedVal.textContent = `ARRIÈRE ${Math.abs(val)}%`;
                speedVal.style.color = '#f59e0b';
            } else {
                speedVal.textContent = 'STOP';
                speedVal.style.color = '#ef4444';
            }
        }

        speedSlider.addEventListener('input', (e) => {
            sendSpeed(parseInt(e.target.value));
        });

        btnStop.addEventListener('click', () => {
            speedSlider.value = 0;
            sendSpeed(0);
        });

        // Set steering wheel
        function sendSteering(val) {
            // Steering factor is between -1.0 (left) and 1.0 (right)
            const factor = (val / 100).toFixed(2);
            sendMessage({
                command: "vars.calc",
                name: "set_steer",
                code: `${factor} (>L:A32NX_PUSHBACK_HDG_FACTOR, Number)`
            });
            
            updateSteerUI(val);
        }

        function updateSteerUI(val) {
            // Update Text
            if (val > 0) {
                steerVal.textContent = `DROITE ${val}%`;
                steerVal.style.color = '#10b981';
            } else if (val < 0) {
                steerVal.textContent = `GAUCHE ${Math.abs(val)}%`;
                steerVal.style.color = '#10b981';
            } else {
                steerVal.textContent = 'CENTRE';
                steerVal.style.color = '#94a3b8';
            }

            // Update joystick visual
            // Base size: 140px, Handle size: 40px
            // Available space for movement: (140 - 40) = 100px. Left range: 0px to 100px. Center: 50px
            const offset = 50 + (val / 100) * 50;
            joyHandle.style.left = `${offset}px`;
        }

        steerSlider.addEventListener('input', (e) => {
            sendSteering(parseInt(e.target.value));
        });

        btnCenter.addEventListener('click', () => {
            steerSlider.value = 0;
            sendSteering(0);
        });

        // Handle Touch / Mouse on Joystick
        let isDraggingJoy = false;
        
        function handleJoystickMovement(clientX) {
            const rect = joyBase.getBoundingClientRect();
            const baseCenterX = rect.left + rect.width / 2;
            let deltaX = clientX - baseCenterX;
            
            // Limit to max offset (50px)
            const maxOffset = 50;
            if (deltaX > maxOffset) deltaX = maxOffset;
            if (deltaX < -maxOffset) deltaX = -maxOffset;
            
            const steerPercent = Math.round((deltaX / maxOffset) * 100);
            steerSlider.value = steerPercent;
            sendSteering(steerPercent);
        }

        joyBase.addEventListener('mousedown', (e) => {
            isDraggingJoy = true;
            handleJoystickMovement(e.clientX);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDraggingJoy) {
                handleJoystickMovement(e.clientX);
            }
        });

        window.addEventListener('mouseup', () => {
            isDraggingJoy = false;
        });

        // Touch support for mobiles
        joyBase.addEventListener('touchstart', (e) => {
            isDraggingJoy = true;
            handleJoystickMovement(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isDraggingJoy) {
                handleJoystickMovement(e.touches[0].clientX);
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isDraggingJoy = false;
        });


        // Process incoming bridge/FSUIPC messages
        function handleIncomingMessage(msg) {
            // Check simulator connection status reported by the bridge
            if (msg.simConnected !== undefined) {
                if (msg.simConnected) {
                    simDot.classList.add('connected');
                } else {
                    simDot.classList.remove('connected');
                }
            }

            // Aircraft information
            if (msg.aircraft) {
                simAircraft.textContent = msg.aircraft;
            }
            if (msg.groundSpeed !== undefined) {
                simGs.textContent = `${Math.round(msg.groundSpeed)} kts`;
            }
            if (msg.parkingBrake !== undefined) {
                simParkBrake.textContent = msg.parkingBrake ? "SERRÉ" : "DESSERRÉ";
                simParkBrake.style.color = msg.parkingBrake ? "#ef4444" : "#10b981";
            }

            // LVAR Values Updates (received from FSUIPC WebSocket Server via Bridge)
            if (msg.name !== undefined && msg.value !== undefined) {
                if (msg.name === "L:A32NX_PUSHBACK_SYSTEM_ENABLED") {
                    setPbSystemState(msg.value === 1);
                } else if (msg.name === "L:A32NX_PUSHBACK_SPD_FACTOR") {
                    const spdValPercent = Math.round(msg.value * 100);
                    if (!isUserInteracting(speedSlider)) {
                        speedSlider.value = spdValPercent;
                        updateSpeedDisplay(spdValPercent);
                    }
                } else if (msg.name === "L:A32NX_PUSHBACK_HDG_FACTOR") {
                    const steerValPercent = Math.round(msg.value * 100);
                    if (!isUserInteracting(steerSlider) && !isDraggingJoy) {
                        steerSlider.value = steerValPercent;
                        updateSteerUI(steerValPercent);
                    }
                }
            }

            // Standard pushback state checks (Tug connected)
            if (msg.pushbackState !== undefined) {
                const isTugActive = msg.pushbackState < 3;
                setTugState(isTugActive);
            }
        }

        function isUserInteracting(el) {
            return el === document.activeElement;
        }

        function updateSpeedDisplay(val) {
            if (val > 0) {
                speedVal.textContent = `AVANT ${val}%`;
                speedVal.style.color = '#3b82f6';
            } else if (val < 0) {
                speedVal.textContent = `ARRIÈRE ${Math.abs(val)}%`;
                speedVal.style.color = '#f59e0b';
            } else {
                speedVal.textContent = 'STOP';
                speedVal.style.color = '#ef4444';
            }
        }

        function setPbSystemState(enabled) {
            pbSystemEnabled = enabled;
            if (enabled) {
                btnPbSystem.classList.add('active');
                lblPbSystem.textContent = 'ACTIVÉ';
                lblPbSystem.style.color = '#10b981';
            } else {
                btnPbSystem.classList.remove('active');
                lblPbSystem.textContent = 'DÉSACTIVÉ';
                lblPbSystem.style.color = 'var(--text-muted)';
            }
        }

        function setTugState(connected) {
            tugConnected = connected;
            if (connected) {
                btnPbTug.classList.add('active');
                lblPbTug.textContent = 'CONNECTÉ';
                lblPbTug.style.color = '#10b981';
            } else {
                btnPbTug.classList.remove('active');
                lblPbTug.textContent = 'DÉCONNECTÉ';
                lblPbTug.style.color = 'var(--text-muted)';
            }
        }

        function resetUIState() {
            simAircraft.textContent = 'Inconnu';
            simGs.textContent = '0 kts';
            simParkBrake.textContent = '-';
            simParkBrake.style.color = 'white';
            setPbSystemState(false);
            setTugState(false);
            speedSlider.value = 0;
            updateSpeedDisplay(0);
            steerSlider.value = 0;
            updateSteerUI(0);
        }

        // Auto connect on load if possible
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(connect, 500);
        });
    </script>
</body>
</html>
