<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Execute</title>
    <style>
        :root {
            --accent: #0071e3;
            --glass: rgba(255, 255, 255, 0.08);
            --bg: #000000;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg); color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* --- ÉCRAN ÉDITEUR --- */
        #editor-layer {
            display: flex; flex-direction: column; height: 100vh;
            padding: 30px; box-sizing: border-box;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }

        .controls { display: flex; gap: 15px; align-items: center; }

        textarea {
            flex: 1; background: #111; color: #eee;
            border: 1px solid #333; border-radius: 18px;
            padding: 25px; font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 15px; line-height: 1.5; outline: none;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            resize: none;
        }

        /* --- BOUTONS & INPUTS --- */
        button {
            background: var(--accent); color: white; border: none;
            padding: 12px 28px; border-radius: 99px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }

        select, input {
            background: var(--glass); color: white; border: 1px solid #444;
            padding: 10px 15px; border-radius: 12px; outline: none; font-size: 13px;
        }

        /* --- ÉCRAN EXÉCUTION --- */
        #view-layer {
            position: fixed; inset: 0; display: none;
            background: #000; justify-content: center; align-items: center;
            z-index: 100;
        }

        #back-trigger {
            position: absolute; top: 20px; left: 20px;
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.2);
            z-index: 1000; transition: 0.3s;
        }
        #back-trigger:hover { background: rgba(255,255,255,0.3); transform: rotate(-90deg); }

        iframe {
            background: #fff; border: none; border-radius: 2px;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        .hidden { transform: scale(0.95); opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="editor-layer">
        <div class="header">
            <h1 style="font-weight: 400; font-size: 24px;">Studio<span style="font-weight: 700;">Execute</span></h1>
            <div class="controls">
                <select id="device" onchange="toggleCustom()">
                    <option value="full">Plein Écran</option>
                    <option value="phone">iPhone 15 Pro</option>
                    <option value="honor">Honor Pad 8 (12")</option>
                    <option value="ipad">iPad Air (1st Gen)</option>
                    <option value="custom">Taille Perso (Pouces)</option>
                </select>
                <input type="number" id="custom-size" placeholder="Pouces" style="display:none; width:80px">
                <button onclick="launch()">Exécuter</button>
            </div>
        </div>
        <textarea id="code" spellcheck="false">
<div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#f5f5f7; font-family:sans-serif;">
    <h2 style="color:#1d1d1f">Accès Périphériques</h2>
    <video id="v" autoplay playsinline style="width:90%; max-width:600px; border-radius:20px; background:#000; box-shadow:0 20px 40px rgba(0,0,0,0.1);"></video>
    <button onclick="start()" style="margin-top:20px; padding:12px 24px; border-radius:12px; border:none; background:#0071e3; color:white; font-weight:600; cursor:pointer;">Activer Caméra</button>
</div>

<script>
async function start() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('v').srcObject = stream;
    } catch (e) {
        alert("Erreur d'accès : " + e.message);
    }
}
</script></textarea>
    </div>

    <div id="view-layer">
        <div id="back-trigger" onclick="closeView()">✕</div>
        <iframe id="sandbox" 
            allow="camera; microphone; display-capture; geolocation; autoplay; clipboard-read; clipboard-write;"
            sandbox="allow-forms allow-modals allow-pointer-lock allow-popups allow-presentation allow-same-origin allow-scripts">
        </iframe>
    </div>

    <script>
        const editor = document.getElementById('editor-layer');
        const view = document.getElementById('view-layer');
        const frame = document.getElementById('sandbox');
        const codeArea = document.getElementById('code');

        function toggleCustom() {
            document.getElementById('custom-size').style.display = 
                (document.getElementById('device').value === 'custom') ? 'block' : 'none';
        }

        function launch() {
            const device = document.getElementById('device').value;
            let w = "100vw", h = "100vh";

            // Calcul des tailles
            if(device === 'phone') { w = "393px"; h = "852px"; }
            if(device === 'honor') { w = "1200px"; h = "840px"; }
            if(device === 'ipad') { w = "768px"; h = "1024px"; }
            if(device === 'custom') {
                const inches = document.getElementById('custom-size').value || 10;
                w = (inches * 85) + "px"; h = (inches * 115) + "px";
            }

            frame.style.width = w;
            frame.style.height = h;

            // Injection du code via srcdoc (plus efficace pour les permissions)
            frame.srcdoc = codeArea.value;

            editor.classList.add('hidden');
            setTimeout(() => {
                view.style.display = 'flex';
                editor.style.display = 'none';
            }, 300);
        }

        function closeView() {
            view.style.display = 'none';
            editor.style.display = 'flex';
            setTimeout(() => editor.classList.remove('hidden'), 10);
            frame.srcdoc = ""; // Coupe la caméra proprement
        }
    </script>
</body>
</html>
